<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omerta — Règlement Légal</title>
<meta name="description" content="Règlement du pôle Légal : entreprises, métiers, services publics et forces de l'ordre.">
<meta name="theme-color" content="#0D0D0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF641E'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<header class="topbar">
  <a class="brand" href="#top">
    <span class="brand-mark" id="brandMark">O</span>
    <span class="brand-txt">
      <span class="brand-name" id="brandName">Omerta</span>
      <span class="brand-sub" id="brandSub">Règlement · Légal</span>
    </span>
  </a>
  <div class="spacer"></div>
  <a class="btn btn-ghost btn-sm" href="admin/" id="staffBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5.5v5.8c0 4.6 3.4 8.9 8 10.2 4.6-1.3 8-5.6 8-10.2V5.5L12 2Z"/><path d="M9 12.5 11 14.5 15.5 10"/></svg>
    Staff
  </a>
  <a class="btn btn-discord btn-sm" href="#" id="discordLink" target="_blank" rel="noopener">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5c1.6.4 2.9 1 4.2 1.8a16.6 16.6 0 0 0-14.9 0c1.3-.8 2.7-1.4 4.2-1.8L8.6 3a19.8 19.8 0 0 0-4.9 1.4C1.2 8.1.5 11.7.8 15.3a20 20 0 0 0 6 3l.8-1.1c-.9-.3-1.7-.7-2.5-1.2l.6-.4a14.2 14.2 0 0 0 12.4 0l.6.4c-.8.5-1.6.9-2.5 1.2l.8 1.1a20 20 0 0 0 6-3c.4-4.2-.6-7.8-2.3-10.9ZM8.9 13.2c-1 0-1.7-.9-1.7-1.9s.8-1.9 1.7-1.9 1.7.9 1.7 1.9-.7 1.9-1.7 1.9Zm6.2 0c-1 0-1.7-.9-1.7-1.9s.8-1.9 1.7-1.9 1.7.9 1.7 1.9-.7 1.9-1.7 1.9Z"/></svg>
    Discord
  </a>
</header>

<main class="wrap" id="top">

  <section class="hero">
    <div class="hero-badge" id="heroBadge">⚖️ Pôle Légal</div>
    <h1 class="hero-title"><span id="heroTitle">Règlement</span> <span class="grad" id="heroAccent">Légal</span></h1>
    <p class="hero-desc" id="heroDesc"></p>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="statSections">—</span><span class="stat-label">Sections</span></div>
      <div class="stat"><span class="stat-num" id="statRules">—</span><span class="stat-label">Règles</span></div>
      <div class="stat"><span class="stat-num" id="statVersion">v1.0</span><span class="stat-label">Version</span></div>
    </div>
  </section>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sommaire">
      <button class="toc-close" id="tocClose" aria-label="Fermer le sommaire">×</button>
      <div class="toc-title" id="tocTitle">Sommaire</div>
      <div id="tocList"></div>
    </nav>

    <div class="main">
      <button class="toc-mobile-btn" id="tocOpen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        Sommaire des sections
      </button>

      <div class="toolbar">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="searchInput" placeholder="Rechercher une règle…" autocomplete="off" spellcheck="false">
          <kbd class="kbd">/</kbd>
        </div>
        <button class="expand-toggle" id="expandBtn">Tout déplier</button>
      </div>
      <p class="search-scope" id="searchScope"></p>

      <div id="catList"></div>
      <div class="state" id="emptyState" hidden>Aucune règle ne correspond à cette recherche.</div>
    </div>
  </div>
</main>

<button class="totop" id="toTop" aria-label="Retour en haut">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="toast" id="toast"></div>

<footer><span id="footerTxt">Omerta · GTA RP — Règlement Légal</span></footer>

<script src="assets/app.js"></script>
</body>
</html>
